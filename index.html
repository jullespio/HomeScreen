<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Firefox Home</title>
    <link rel="shortcut icon" type="image/png" href="icons/favicon.png" />

    <link rel="stylesheet" href="css/style.css" />

    <script src="https://unpkg.com/feather-icons"></script>
  </head>

  <body class="">
    <button id="themeButton">
      <i id="themeButton__icon" data-feather="moon"></i>
    </button>

    <div class="container">
      <!-- Clock and Greetings  -->

      <div class="timeBlock">
        <div class="clock">
          <div id="hour"></div>
          <div id="separator">:</div>
          <div id="minutes"></div>
          <div id="ampm"></div>
          <div id="suffix"></div>
        </div>

        <!-- Diurnal Progress Telemetry Line -->
        <div id="day-progress-container">
          <div id="day-progress-fill"></div>
        </div>

        <div id="utc">
          <span id="utc-text">UTC -3:00</span>
          <span id="subspace"> • SUBSPACE LATENCY --ms</span>
        </div>

        <div id="stardate"></div>
        <div id="greetings"></div>
      </div>
      <!-- Date and Weather  -->

      <div class="weatherBlock">

        <div id="earth" class=""></div>

        <div class="weatherBlock__date">
          <div id="month" class=""></div>
          <div id="day" class=""></div>
          <div id="year" class=""></div>
        </div>

        <div class="weatherBlock__weather">
          <div class="weather-icon">
            <img src="icons/OneDark/unknown.png" />
          </div>
          <div class="temperature-value">
            <p class="">- °<span class="g">c</span></p>
          </div>
          <div class="temperature-description">
            <p class=""></p>
            <p id="feels-like"></p>
            <p id="sun"></p>
            <p id="last-updated"></p>
          </div>
        </div>
      </div>

      <!-- Buttons Links  -->

      <div class="buttonLink"></div>

      <!-- Lists  -->
    </div>

    <!-- Scripts  -->

    <script src="js/config.js"></script>
    <script src="js/time.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/greeting.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/stardate.js"></script>
    <script src="js/telemetry.js"></script>
    <script src="js/hotkeys.js"></script>
    <script src="js/links.js"></script>
    <script>
      feather.replace();
    </script>
  </body>

  <!-- Coded and designed by Miguel R. Ávila: https://github.com/MiguelRAvila -->
  <!-- This modified version by Julles Pio: https://github.com/jullespio -->
</html>
